# Self-hosted LiveKit server config for local development.
# Dev-only credentials — never use these in production, rotate before any real deployment.
#
# rtc.node_ip must be this machine's current LAN IP, not 127.0.0.1 — it's
# embedded in the ICE candidates LiveKit hands to every participant, so any
# device that isn't literally this machine (a phone, another laptop) needs
# a real, reachable address there. Same-machine multi-tab testing still
# works fine with a LAN IP here too, so there's no reason to special-case
# 127.0.0.1. Restart `docker compose up -d` after changing this.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882 # single muxed UDP port for all RTC media — keeps Docker port mapping simple
  node_ip: 192.168.213.153 # this machine's current LAN IP — see README, must be updated whenever it changes (unlike the frontend's API base, this can't self-detect: it's read by the LiveKit container, not app code)
  use_external_ip: false

keys:
  devkey: devsecret1234567890devsecret

logging:
  level: info

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 0
